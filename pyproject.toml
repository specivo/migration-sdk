[project]
name = "specivo-migration-sdk"
version = "0.2.0"
description = "Write and validate Specivo import bundles"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Specivo" }]
keywords = ["specivo", "migration", "import", "bundle", "issue-tracker"]
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.28.4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Bug Tracking",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://specivo.io"
Documentation = "https://specivo.io/docs/specivo/"
Repository = "https://github.com/specivo/migration-sdk"
Issues = "https://github.com/specivo/migration-sdk/issues"

[project.scripts]
specivo-bundle = "specivo_migration_sdk.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specivo_migration_sdk"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
# The README's examples are laid out for reading, not by the formatter.
extend-exclude = ["*.md", "specivo-core"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
